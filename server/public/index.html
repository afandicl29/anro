<!DOCTYPE html>
<html>

<head>

<title>ANRO Guardian</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
}


video{
    width:auto;
    height:80vh;
    max-width:100%;
    object-fit:contain;
    background:black;
    border:2px solid #555;
}


button,select{

    padding:10px;
    margin:5px;

    font-size:16px;

}

</style>


</head>


<body>


<h2>
ANRO Guardian
</h2>


<select id="deviceList">

</select>


<button onclick="requestScreen()">
CONNECT
</button>

<button onclick="disconnectScreen()">
DISCONNECT
</button>


<br><br>


<video
id="remoteVideo"
autoplay
playsinline
muted>
</video>



<script>


let ws=null;

let pc=null;


let selectedDevice=null;


let iceQueue=[];



const video =
document.getElementById(
"remoteVideo"
);



/*
=========================
 WEBSOCKET
=========================
*/


function connectWS(){


ws =
new WebSocket(
"ws://192.168.0.116:3000/ws"
);



ws.onopen=function(){


console.log(
"WS CONNECTED"
);



ws.send(JSON.stringify({

type:"register",

deviceId:"parent-web-001",

role:"parent"

}));



loadDevices();


};





ws.onmessage =
async function(event){


let msg =
JSON.parse(
event.data
);



console.log(
"RX",
msg
);




/*
 RECEIVE OFFER
*/


if(
msg.type==="webrtc_offer"
){



await createPeer();



await pc.setRemoteDescription({

type:"offer",

sdp:msg.sdp

});



console.log(
"REMOTE SDP OK"
);



/*
 add queued ICE
*/


for(
let c of iceQueue
){


try{


await pc.addIceCandidate(
new RTCIceCandidate(c)
);



console.log(
"QUEUED ICE OK"
);


}catch(e){

console.log(e);

}


}



iceQueue=[];



let answer =
await pc.createAnswer();



await pc.setLocalDescription(
answer
);



ws.send(JSON.stringify({

type:"webrtc_answer",

target:selectedDevice,

sdp:answer.sdp


}));



console.log(
"ANSWER SENT"
);



}




/*
 RECEIVE ICE
*/


if(
msg.type==="ice_candidate"
){


if(!pc)
return;



if(
!pc.remoteDescription
){


console.log(
"QUEUE ICE"
);



iceQueue.push(
msg.candidate
);



return;

}



try{


await pc.addIceCandidate(

new RTCIceCandidate(
msg.candidate
)

);



console.log(
"ICE OK"
);



}catch(e){


console.log(
"ICE ERROR",
e
);


}



}



};



ws.onclose=function(){


console.log(
"WS CLOSED"
);


setTimeout(
connectWS,
3000
);


};



}




/*
=========================
 PEER CONNECTION
=========================
*/


async function createPeer(){


if(pc){


try{

pc.close();

}catch(e){}


}



iceQueue=[];



pc =
new RTCPeerConnection({


iceServers:[

{

urls:
"stun:stun.l.google.com:19302"

}

]


});





pc.onicecandidate =
function(e){



if(
e.candidate
){


ws.send(JSON.stringify({

type:"ice_candidate",

target:selectedDevice,

candidate:e.candidate


}));


console.log(
"ICE SEND"
);


}



};






pc.onconnectionstatechange =
function(){


console.log(

"PC STATE",

pc.connectionState

);


};






pc.ontrack =
function(e){
const track = e.track;

track.onunmute = async () => {
    const stats = await pc.getStats();

    stats.forEach(report => {
        if (report.type === "inbound-rtp" && report.kind === "video") {
            console.log("Inbound Video", report);
        }
    });
};


console.log(
"TRACK RECEIVED",
e.track.kind
);



let stream =
e.streams[0];



if(!stream){


stream =
new MediaStream();


stream.addTrack(
e.track
);


}




video.srcObject =
stream;



video.onloadedmetadata =
function(){


console.log(
"VIDEO READY"
);



video.play()

.then(()=>{


console.log(
"VIDEO PLAY OK"
);


})

.catch(err=>{


console.log(
"VIDEO PLAY ERROR",
err
);


});



};



};



}






/*
=========================
 DEVICE LIST
=========================
*/


async function loadDevices(){


let res =
await fetch(
"/api/device/list"
);



let data =
await res.json();



let select =
document.getElementById(
"deviceList"
);



select.innerHTML="";



data.devices
.filter(
d=>d.role==="child"
)
.forEach(
function(d){



let option =
document.createElement(
"option"
);



option.value =
d.deviceId;



option.text =
(
d.deviceName ||
"Unknown"
)
+
" - "
+
(
d.model ||
""
);



select.appendChild(
option
);



});



}






/*
=========================
 REQUEST SCREEN
=========================
*/


function requestScreen(){


selectedDevice =

document.getElementById(
"deviceList"
)
.value;



console.log(
"REQUEST SCREEN",
selectedDevice
);



ws.send(JSON.stringify({

type:"screen_request",

target:selectedDevice


}));



}

function disconnectScreen(){


console.log(
"DISCONNECT",
selectedDevice
);



ws.send(JSON.stringify({

type:"disconnect",

target:selectedDevice

}));



if(pc){


try{

pc.close();

}catch(e){

console.log(e);

}


pc=null;

}



video.srcObject=null;



}




connectWS();



</script>


</body>


</html>
